type: object
properties:
  name:
    type: string
    minLength: 3
    maxLength: 20
    example: "John Doe"
  phoneNumber:
    type: string
    minLength: 3
    maxLength: 20
    example: "+380991112233"
  email:
    type: string
    minLength: 3
    maxLength: 20
    example: "john@example.com"
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: "work"
required: []
description: 
  Schema for updating an existing contact. All fields are optional, but at least one must be provided.
