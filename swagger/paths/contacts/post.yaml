tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a contact with payload
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
          - userId
        properties:
          name:
            description: Contact name
            type: string
            example: John Deere
          phoneNumber:
            type: string
            description: Contact phone number
            example: +380997112233
          email:
            type: string
            description: Contact email
            example: olenaI@gmail.com
          isFavourite:
            type: boolean
            description: Favourite contact
            example: false
          contactType:
            type: string
            description: Type of the contact
            enum: [work, home, personal]
            example: personal
          userId:
            type: string
            description: Contact user id
            example: 68efd834f1781f960b1e7a6c
          photo:
            description: Contact's photo
            type: string
            format: binary

responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
